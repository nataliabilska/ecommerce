<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep - Rozproszona Saga</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-6 flex flex-col items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Sklep E-commerce</h1>
        
        <div class="space-y-4">
            <button onclick="placeOrder(2)" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition">
                Zamów 2 sztuki (Sukces)
            </button>

            <button onclick="placeOrder(6)" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-xl transition">
                Zamów 6 sztuk (Brak towaru - Saga Rollback)
            </button>
        </div>

        <div id="status" class="mt-6 text-sm text-gray-600 font-mono bg-gray-50 p-3 rounded-lg min-h-[60px] whitespace-pre-line">
            Czekam na akcję...
        </div>
    </div>

    <script>
        const LAPTOP_IP = "192.168.1.11"; 

        const ORDER_SERVICE_URL = `http://${LAPTOP_IP}:8000`;
        const STATUS_LABELS = {
            PENDING: "W trakcie przetwarzania...",
            COMPLETED: "Zamówienie zrealizowane — towar zarezerwowany.",
            CANCELED: "Zamówienie anulowane — brak towaru, płatność zwrócona."
        };

        async function refreshOrderStatus(orderId, statusDiv) {
            for (let attempt = 0; attempt < 30; attempt += 1) {
                await new Promise(resolve => setTimeout(resolve, 1000));
                const response = await fetch(`${ORDER_SERVICE_URL}/orders/${orderId}`);
                if (!response.ok) {
                    throw new Error(`Nie udało się pobrać statusu zamówienia (${response.status}).`);
                }

                const order = await response.json();
                statusDiv.textContent = `Zamówienie ID: ${order.order_id}\n${STATUS_LABELS[order.status] ?? order.status}`;
                if (order.status !== "PENDING") {
                    return;
                }
            }

            statusDiv.textContent += "\nZamówienie nadal jest przetwarzane. Odśwież stronę za chwilę.";
        }

        async function placeOrder(quantity) {
            const statusDiv = document.getElementById('status');
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => button.disabled = true);
            statusDiv.textContent = "Wysyłanie zamówienia...";
            
            try {
                const response = await fetch(`${ORDER_SERVICE_URL}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: 1, quantity: quantity, user_id: 99 })
                });
                if (!response.ok) {
                    throw new Error(`Nie udało się utworzyć zamówienia (${response.status}).`);
                }

                const data = await response.json();
                statusDiv.textContent = `Zamówienie ID: ${data.order_id}\n${STATUS_LABELS[data.status] ?? data.status}`;
                await refreshOrderStatus(data.order_id, statusDiv);
            } catch (error) {
                statusDiv.textContent = `Błąd: ${error.message}`;
            } finally {
                buttons.forEach(button => button.disabled = false);
            }
        }
    </script>
</body>
</html>
